<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071018">
  <title>Connexion multijoueur · Nova Flight</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071018 url("assets/menu/dead-flight-hero.png") center/cover;color:#eef8fc;font:16px "Segoe UI",sans-serif}
    main{width:min(540px,92vw);padding:34px;border:1px solid #376477;border-radius:16px;background:#071018e8;box-shadow:0 20px 70px #000a;text-align:center}
    h1{font-size:clamp(38px,8vw,68px);line-height:.9;margin:0 0 20px;text-transform:uppercase}span{color:#55d9ff}p{color:#a5b7c0}.error{color:#ff8d98}
  </style>
</head>
<body>
<main>
  <h1>Nova <span>Flight</span></h1>
  <p id="status">Vérification de votre compte Ghost Chat…</p>
</main>
<script>
(async()=>{
  const status=document.querySelector("#status");
  const query=new URLSearchParams(location.search);
  try{
    const ticket=query.get("ticket");
    if(ticket){
      const exchange=await fetch("/api/sso/exchange",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({ticket})});
      if(!exchange.ok)throw new Error((await exchange.json()).detail||"Connexion refusée");
      history.replaceState(null,"","/multiplayer.html");
    }
    const me=await fetch("/api/sso/me",{credentials:"same-origin"});
    if(!me.ok)throw new Error("Lancez Nova Flight depuis Ghost Chat.");
    const pilot=await me.json();
    status.textContent=`Bienvenue ${pilot.username}. Recherche d’un second pilote…`;
    const match=await fetch("/api/multiplayer/quick-join",{method:"POST",credentials:"same-origin"});
    if(!match.ok)throw new Error((await match.json()).detail||"Salon indisponible");
    const room=await match.json();
    location.replace(`/mondes.html?map=nova-city&mode=chasseur&multiplayer=1&room=${encodeURIComponent(room.room_id)}`);
  }catch(error){
    status.className="error";
    status.textContent=error.message;
  }
})();
</script>
</body>
</html>
