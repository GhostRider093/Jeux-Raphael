<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vol dans le tunnel — Nova Flight</title>
<!--
  Vol libre dans une carte de tunnel, aux commandes du chasseur.

  Le manche est la SOURIS : sa position dans la fenetre est la position du
  manche, centre au neutre. Un avion se pilote a l'inclinaison, pas par
  a-coups de touches — c'est le seul reglage qui rende le tunnel jouable.
-->
<style>
  :root {
    --bevel: polygon(0 9px, 9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:#04080d; color:#bdefff; overflow:hidden; cursor:crosshair;
         font-family:"Bahnschrift SemiCondensed","Segoe UI Variable Display",sans-serif; }
  canvas { display:block; position:fixed; inset:0; width:100vw; height:100vh; }
  .panel {
    position:absolute; z-index:10; padding:12px 15px;
    background:rgba(4,12,20,.86); border:1px solid rgba(150,205,230,.34);
    clip-path:var(--bevel);
    box-shadow:inset 0 0 0 1px rgba(4,12,20,.85), inset 0 16px 30px rgba(0,0,0,.45);
  }
  #hud { top:14px; left:14px; min-width:230px; }
  #aide { bottom:14px; left:14px; font-size:12.5px; line-height:1.8; }
  h1 { margin:0 0 9px; font-size:14px; letter-spacing:2.2px; text-transform:uppercase; color:#78dff6; }
  .ligne { display:flex; justify-content:space-between; gap:20px; font-size:13px; padding:2px 0; }
  .ligne span:last-child { color:#eaf8ff; font-variant-numeric:tabular-nums; font-weight:700; }
  /* Un fond colore fait une boite : le texte y est centre. */
  #etat { margin-top:9px; padding:6px; text-align:center; font-weight:700; letter-spacing:1.4px;
          font-size:12px; background:#0d2430; color:#7be5a0; }
  #etat.touche { background:#4a1220; color:#ffd7de; }
  kbd { padding:1px 6px; border:1px solid rgba(150,205,230,.4); background:rgba(120,223,246,.1);
        font-family:inherit; font-size:.94em; }
  #chargement {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; background:#04080d;
  }
  #chargement h2 { margin:0; font-size:17px; letter-spacing:3.5px; text-transform:uppercase; color:#78dff6; }
  #barre { width:330px; height:5px; background:rgba(120,223,246,.15); }
  #barre i { display:block; height:100%; width:0; background:#54f6ff; transition:width .15s; }
  #chargement p { margin:0; font-size:13px; color:#8fb6c8; letter-spacing:.6px; }
  /* Le manche : un reticule qui montre ou en est la commande. */
  #manche { position:fixed; z-index:9; left:50%; top:50%; width:190px; height:190px;
            margin:-95px 0 0 -95px; pointer-events:none;
            border:1px solid rgba(120,223,246,.16); border-radius:50%; }
  #manche::before { content:""; position:absolute; inset:50% auto auto 50%; width:5px; height:5px;
                    margin:-2.5px 0 0 -2.5px; background:rgba(120,223,246,.5); }
</style>
<!-- L'appareil, decrit une seule fois. Script classique : charge avant les modules. -->
<script src="./chasseur-model.js?v=chasseur-unique-20260907"></script>
<script type="importmap">
{ "imports": { "three": "./libs/three.module.js" } }
</script>
</head>
<body>

<div id="chargement">
  <h2>Chargement du chasseur</h2>
  <div id="barre"><i></i></div>
  <p id="chargement-detail">le modèle pèse 39 Mo…</p>
</div>

<div id="manche"></div>

<div id="hud" class="panel">
  <h1 id="titre">Tracé d'essai</h1>
  <div class="ligne"><span>Vitesse</span><span id="vitesse">0</span></div>
  <div class="ligne"><span>Altitude</span><span id="altitude">0</span></div>
  <div class="ligne"><span>Poussée</span><span id="poussee">0 %</span></div>
  <div id="etat">EN VOL</div>
</div>

<div id="aide" class="panel">
  <strong style="color:#78dff6">Souris</strong> = manche · haut/bas pique et cabre, gauche/droite vire<br>
  <kbd>Z</kbd> <kbd>S</kbd> puissance · <kbd>Maj</kbd> post-combustion · <kbd>R</kbd> revenir à l'entrée<br>
  <kbd>C</kbd> caméra proche ou large
</div>

<script>
// Une exception dans un module ES ne laisse qu'une page noire et un message
// dans une console que personne n'ouvre. Tout est donc affiche a l'ecran.
addEventListener('error', e => {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;z-index:99;left:14px;right:14px;top:14px;padding:14px;'
    + 'background:#4a1220;color:#ffd7de;border:1px solid #ff6a86;white-space:pre-wrap;font-size:13px';
  box.textContent = `${e.message}\n${e.error?.stack || ''}`;
  document.body.appendChild(box);
  document.getElementById('chargement')?.remove();
});
</script>

<script type="module">
import * as THREE from 'three';
import { getTunnelMap, listerCartes, synchroniser } from './maps/tunnel-maps.js?v=tunnels-20260906a';
import { createTunnel } from './maps/tunnel-geometry.js?v=tunnels-20260906a';
import { creerDecor } from './maps/tunnel-decor.js?v=tunnels-20260906a';
import { creerChasseur, creerChasseurSimple } from './maps/fighter-model.js?v=chasseur-unique-20260907';
import { createCollisionField, queryHit, addBoxFromCenter } from './maps/world-collision.js?v=tunnels-20260906a';

const params = new URLSearchParams(location.search);
const carteDemandee = params.get('map');
// Une carte tracee sur une autre machine n'est pas encore dans ce navigateur.
// On ne va la chercher au serveur que si on ne la connait pas : voler une
// carte deja locale ne doit rien attendre du reseau, et le mode solo doit
// rester jouable en site statique, ou cet appel echoue en silence.
if (carteDemandee && !listerCartes()[carteDemandee]) await synchroniser();
const carte = getTunnelMap(carteDemandee);
document.getElementById('titre').textContent = carte.label;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Une carte spatiale n'a ni sol, ni horizon, ni brume. La brume est le point
// qui compte : dans le vide elle ne diffuse rien, et un tunnel noye dans une
// soupe grise perd la seule chose qui reste ici, la sensation de vitesse.
const espace = carte.espace === true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(espace ? 0x02030a : 0x0a1826);
if (!espace) scene.fog = new THREE.Fog(0x0a1826, 2600, 9000);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, .4, 22000);

// Dans l'espace, l'ambiance est baissee pour que le bandeau lumineux de la
// paroi domine : c'est lui qui defile, donc lui qui donne la vitesse.
scene.add(new THREE.HemisphereLight(0xa8d8ff, 0x101820, espace ? .5 : 1.5));
const soleil = new THREE.DirectionalLight(0xffffff, espace ? .75 : 1.25);
soleil.position.set(1200, 2400, 900);
scene.add(soleil);

// ── LA CARTE ────────────────────────────────────────────────────────────────
const field = createCollisionField(7);

if (espace) {
  // Un champ d'etoiles, et rien d'autre. Il ne sert pas a decorer : sans un
  // fond fixe, une paroi lisse ne dit plus de quel cote on tourne. Les points
  // sont poses sur une sphere lointaine, hors de portee du plan de coupe.
  const ETOILES = 2600, RAYON = 17000;
  const sommets = new Float32Array(ETOILES * 3);
  for (let i = 0; i < ETOILES; i++) {
    // Repartition uniforme sur la sphere : tirer la latitude au hasard les
    // tasserait aux poles.
    const z = Math.random() * 2 - 1;
    const angle = Math.random() * Math.PI * 2;
    const rayon = Math.sqrt(1 - z * z);
    sommets[i * 3] = Math.cos(angle) * rayon * RAYON;
    sommets[i * 3 + 1] = Math.sin(angle) * rayon * RAYON;
    sommets[i * 3 + 2] = z * RAYON;
  }
  const geometrieEtoiles = new THREE.BufferGeometry();
  geometrieEtoiles.setAttribute('position', new THREE.BufferAttribute(sommets, 3));
  scene.add(new THREE.Points(geometrieEtoiles, new THREE.PointsMaterial({
    color: 0xdfefff, size: 34, sizeAttenuation: true, depthWrite: false
  })));
} else {
  const sol = new THREE.Mesh(
    new THREE.PlaneGeometry(24000, 24000),
    new THREE.MeshStandardMaterial({ color: 0x16202b, roughness: 1 })
  );
  sol.rotation.x = -Math.PI / 2;
  sol.position.y = -2;
  scene.add(sol);

  const grille = new THREE.GridHelper(20000, 100, 0x27566b, 0x142b38);
  grille.position.y = -1;
  scene.add(grille);
}

const tunnel = createTunnel({ ...carte.tunnel, name: 'tunnel-carte' });
scene.add(tunnel.mesh);
tunnel.registerCollision(field);

scene.add(creerDecor(carte, field));

// ── LE CHASSEUR ─────────────────────────────────────────────────────────────
const barre = document.querySelector('#barre i');
const detail = document.getElementById('chargement-detail');

let appareil;
try {
  appareil = await creerChasseur((recu, total) => {
    const part = total ? recu / total : 0;
    barre.style.width = `${Math.round(part * 100)}%`;
    detail.textContent = `${(recu / 1048576).toFixed(1)} Mo sur ${(total / 1048576).toFixed(0)} Mo`;
  });
} catch (erreur) {
  console.warn('[vol] modele indisponible, appareil de repli', erreur);
  appareil = creerChasseurSimple();
}

const pilote = new THREE.Group();
pilote.add(appareil.groupe);
scene.add(pilote);
document.getElementById('chargement').remove();

// ── PILOTAGE ────────────────────────────────────────────────────────────────
const CROISIERE = 190, MAX = 460, MIN = 60;
let vitesse = CROISIERE, lacet = 0, tangage = 0, roulis = 0, poussee = .5;
let cameraLarge = false;

// Position du manche : -1 a +1 sur chaque axe, prise dans la fenetre. Aucun
// clic requis — la souris EST le manche des qu'elle bouge.
const manche = { x: 0, y: 0 };
const ZONE_MORTE = .09;

/**
 * Reponse du manche. Deux corrections, sans lesquelles le tunnel est
 * intenable :
 *   - une zone morte au centre, sinon un curseur pose a deux pixels du milieu
 *     fait deriver l'appareil en continu et la ligne droite devient un
 *     exercice d'equilibriste ;
 *   - une courbe au carre, qui rend les petits ecarts doux et garde toute la
 *     force aux grands. Une reponse lineaire donne un avion nerveux au centre
 *     et mou dans les coins.
 */
function doser(valeur) {
  const amplitude = Math.abs(valeur);
  if (amplitude < ZONE_MORTE) return 0;
  const utile = (amplitude - ZONE_MORTE) / (1 - ZONE_MORTE);
  return Math.sign(valeur) * utile * utile;
}

addEventListener('pointermove', e => {
  manche.x = THREE.MathUtils.clamp((e.clientX / innerWidth) * 2 - 1, -1, 1);
  manche.y = THREE.MathUtils.clamp((e.clientY / innerHeight) * 2 - 1, -1, 1);
});

const touches = Object.create(null);
addEventListener('keydown', e => {
  touches[e.code] = true;
  if (e.code === 'KeyC') cameraLarge = !cameraLarge;
  if (e.code === 'KeyR') replacer();
});
addEventListener('keyup', e => { touches[e.code] = false; });

function replacer() {
  const depart = tunnel.curve.getPointAt(0);
  const suite = tunnel.curve.getPointAt(.015);
  const axe = suite.clone().sub(depart).normalize();
  // Un tunnel ouvert a une entree : on se place 260 m avant, dehors, et on y
  // penetre. Un circuit ferme n'en a pas — reculer de 260 m sortirait par la
  // paroi. On y demarre donc sur l'axe, deja dedans.
  pilote.position.copy(depart).addScaledVector(axe, carte.tunnel?.closed ? 0 : -260);
  lacet = Math.atan2(-axe.x, -axe.z);
  tangage = Math.asin(THREE.MathUtils.clamp(axe.y, -1, 1));
  roulis = 0;
  vitesse = CROISIERE;
}
replacer();

// Vecteurs reutilises : la boucle de vol ne doit rien allouer.
const avant = new THREE.Vector3();
const deplacement = new THREE.Vector3();
const cible = new THREE.Vector3();
const positionVoulue = new THREE.Vector3();
const hausse = new THREE.Vector3(0, 1, 0);

const champVitesse = document.getElementById('vitesse');
const champAltitude = document.getElementById('altitude');
const champPoussee = document.getElementById('poussee');
const etat = document.getElementById('etat');
const horloge = new THREE.Clock();

function boucle() {
  const dt = Math.min(horloge.getDelta(), .05);

  // Puissance : la vitesse se commande, elle ne se subit pas.
  const gaz = (touches.KeyW || touches.KeyZ ? 1 : 0) - (touches.KeyS ? 1 : 0);
  poussee = THREE.MathUtils.clamp(poussee + gaz * dt * .8, 0, 1);
  const postCombustion = touches.ShiftLeft || touches.ShiftRight;
  const vitesseVoulue = MIN + poussee * (MAX - MIN) * (postCombustion ? 1.25 : 1);
  vitesse += (vitesseVoulue - vitesse) * Math.min(1, dt * 1.1);

  // Le manche commande une VITESSE de rotation, proportionnelle a son ecart au
  // centre : au neutre l'appareil garde son cap, ce qui est le seul moyen de
  // tenir une ligne droite dans un tunnel.
  const clavier = {
    x: (touches.ArrowRight ? 1 : 0) - (touches.ArrowLeft ? 1 : 0),
    y: (touches.ArrowDown ? 1 : 0) - (touches.ArrowUp ? 1 : 0)
  };
  const commandeX = THREE.MathUtils.clamp(doser(manche.x) + clavier.x, -1, 1);
  const commandeY = THREE.MathUtils.clamp(doser(manche.y) + clavier.y, -1, 1);

  lacet -= commandeX * 1.05 * dt;
  tangage = THREE.MathUtils.clamp(tangage - commandeY * .95 * dt, -1.25, 1.25);
  // Le roulis suit le virage : un avion s'incline dans ses courbes, sinon il
  // donne la sensation d'un curseur qu'on fait glisser.
  roulis += (-commandeX * .85 - roulis) * Math.min(1, dt * 3.4);

  avant.set(
    -Math.sin(lacet) * Math.cos(tangage),
    Math.sin(tangage),
    -Math.cos(lacet) * Math.cos(tangage)
  );
  deplacement.copy(avant).multiplyScalar(vitesse * dt);
  pilote.position.add(deplacement);

  // Orientation de l'appareil : nez dans l'axe de vol, plus le roulis.
  //
  // On vise DERRIERE, et ce n'est pas une erreur. `Object3D.lookAt` oriente le
  // +Z vers la cible pour un objet ordinaire — l'inverse d'une camera, qui y
  // pointe son -Z. Or le chasseur est construit « nez vers -Z »
  // (`maps/fighter-model.js`). Viser devant lui faisait donc voler l'appareil
  // a reculons, cul par-dessus tete. En visant le point situe en arriere, le
  // +Z part vers la queue et le nez tombe dans l'axe de vol.
  //
  // Le roulis suit : `rotateZ` tourne autour de ce meme +Z, dirige vers
  // l'arriere, et l'aile qui plonge est bien celle de l'interieur du virage.
  cible.copy(pilote.position).sub(avant);
  pilote.lookAt(cible);
  pilote.rotateZ(roulis);

  // Collision : la poussee rendue par le champ degage l'appareil de la paroi.
  const contact = queryHit(field, pilote.position.x, pilote.position.y, pilote.position.z);
  if (contact.active) {
    pilote.position.x += contact.pushX;
    pilote.position.y += contact.pushY;
    pilote.position.z += contact.pushZ;
    vitesse *= .86;              // on rale contre la paroi, on ne s'arrete pas net
  }
  // Le sol arrete aussi : sans cela on passe dessous et on vole a l'envers.
  // Dans l'espace il n'y a pas de sol, et ce plancher couperait la moitie
  // basse du circuit — l'anneau descend a -570.
  if (!espace && pilote.position.y < 6) { pilote.position.y = 6; if (tangage < 0) tangage = 0; }

  etat.classList.toggle('touche', contact.active);
  etat.textContent = contact.active ? 'CONTACT PAROI' : 'EN VOL';

  // Camera de poursuite, derriere et au-dessus.
  const recul = cameraLarge ? 145 : 78;
  const hauteur = cameraLarge ? 46 : 24;
  positionVoulue.copy(pilote.position).addScaledVector(avant, -recul).addScaledVector(hausse, hauteur);
  camera.position.lerp(positionVoulue, Math.min(1, dt * 4.2));
  cible.copy(pilote.position).addScaledVector(avant, 130);
  camera.lookAt(cible);

  champVitesse.textContent = vitesse.toFixed(0);
  champAltitude.textContent = pilote.position.y.toFixed(0);
  champPoussee.textContent = `${Math.round(poussee * 100)} %${postCombustion ? ' + PC' : ''}`;

  // Le format est verifie a chaque image : selon le moment ou la page est
  // mesuree, `innerWidth` peut encore valoir zero, et un canvas de zero pixel
  // ne rend rien — sans la moindre erreur pour le dire.
  const largeur = renderer.domElement.clientWidth || innerWidth;
  const haut = renderer.domElement.clientHeight || innerHeight;
  const densite = renderer.getPixelRatio();
  if (renderer.domElement.width !== Math.round(largeur * densite)
      || renderer.domElement.height !== Math.round(haut * densite)) {
    renderer.setSize(largeur, haut, false);
    camera.aspect = largeur / Math.max(1, haut);
    camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
  requestAnimationFrame(boucle);
}
boucle();
</script>
</body>
</html>
