<!DOCTYPE html>
<html lang="fr">
<head>
<script src="./son-silence.js?v=coupe-son-20260922"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rouler dans le village</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { --panel: rgba(14, 18, 26, .72); --line: rgba(255, 255, 255, .14); --ink: #eef2f7; --dim: #a9b3c1; --accent: #ffcf4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: var(--ink);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
               overscroll-behavior: none; -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; touch-action: none; }
  #scene canvas { display: block; }
  .panel { position: absolute; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border: 1px solid var(--line); border-radius: 12px; }
  #hud { top: 14px; left: 14px; padding: 12px 14px; width: 300px; max-width: calc(100vw - 28px); }
  #hud h1 { margin: 0; font-size: 18px; letter-spacing: .3px; cursor: pointer; user-select: none; }
  #hud h1 small { font-weight: 400; color: var(--dim); font-size: 13px; }
  #hud h1::after { content: "▾"; float: right; color: var(--dim); font-size: 14px; margin-top: 3px; }
  #hud.collapsed h1::after { content: "▸"; }
  #hud.collapsed > :not(h1) { display: none; }
  #stats { color: var(--dim); font-size: 12px; margin: 2px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .row[hidden] { display: none; }
  .row button { min-width: 64px; }
  .row .titre { flex: 100%; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }
  button { flex: 1; cursor: pointer; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink);
           border-radius: 8px; padding: 7px 6px; font: inherit; font-size: 13px; }
  button:hover { background: rgba(255,255,255,.12); }
  button:disabled { opacity: .5; cursor: wait; }
  button.on { background: var(--accent); color: #1b1600; border-color: var(--accent); font-weight: 600; }
  a.village { flex: 1; text-align: center; text-decoration: none; color: var(--ink); border: 1px solid var(--line);
              background: rgba(255,255,255,.06); border-radius: 8px; padding: 7px 6px; font-size: 13px; }
  a.village.on { background: rgba(255,207,74,.22); border-color: var(--accent); color: #fff; font-weight: 600; }
  #search { width: 100%; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--ink);
            border-radius: 8px; padding: 7px 9px; font: inherit; }
  .time { display: flex; gap: 8px; align-items: center; }
  .time input { flex: 1; accent-color: var(--accent); }
  .chips button { padding: 5px 4px; font-size: 12px; }
  #clock { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: var(--accent); }
  #sources { color: var(--dim); font-size: 11px; margin-top: 10px; }
  .mini { flex: none; padding: 2px 8px; font-size: 12px; margin-left: 2px; }
  /* Une seule voiture sur cette page : le choix GT / berline n'a pas lieu d'être,
     seul le bouton du son reste. */
  #choix-auto [data-auto] { display: none; }
  /* ─────────────────────────────── QUALITÉ ─────────────────────────────────
     Trois niveaux, le conseillé souligné, un compteur d'images par seconde. */
  #qualite [data-niveau].conseille { box-shadow: inset 0 -3px 0 var(--accent); }
  #qualite-note { flex: 100%; color: var(--dim); font-size: 11px; line-height: 1.35; }
  #qualite .compteur { flex: none; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: auto; }
  #qualite .compteur b { color: var(--ink); }
  #help-walk { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 13px;
               white-space: normal; max-width: min(1180px, calc(100vw - 28px)); text-align: center; }
  #help-walk .mini { margin: 2px 2px 0; }
  #help-walk[hidden], #card[hidden], #vol[hidden], #combat[hidden], #viseur[hidden], #depart-auto[hidden], #auto[hidden] { display: none; }
  #minimap { position: absolute; right: 14px; bottom: 14px; width: 200px; height: 200px; border-radius: 12px;
             border: 1px solid var(--line); cursor: crosshair; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #card { right: 14px; top: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; max-width: 280px; }
  #card small { color: var(--dim); }
  /* Compteur de l'engin : un gros chiffre, le rapport, une barre de régime. */
  #auto { left: 14px; bottom: 14px; padding: 9px 13px 11px; width: 190px; }
  #auto .compteur { display: flex; align-items: baseline; gap: 6px; }
  #auto .compteur b { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  #auto .compteur span { font-size: 12px; color: var(--dim); }
  #auto .compteur i { margin-left: auto; font-style: normal; font-size: 18px; font-weight: 700; color: var(--accent); }
  #regime { margin-top: 8px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
  #regime i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg,#4fd0ff,#8be9ff);
              transition: width .06s linear; }
  #auto.rouge #regime i { background: linear-gradient(90deg,#ff7a3d,#ff3d3d); }
  #auto.glisse .compteur b { color: #ffb36b; }
  /* Figure réussie (ou chute) : une bannière au centre, qui monte et s'efface. */
  #figure { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center;
            pointer-events: none; opacity: 0; z-index: 5; }
  #figure[hidden] { display: none; }
  #figure b { display: block; font-size: 40px; font-weight: 800; letter-spacing: 1px; color: var(--accent);
              text-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 24px rgba(255,207,74,.35); }
  #figure small { display: block; font-size: 15px; color: #fff; text-shadow: 0 1px 4px #000; margin-top: 4px; }
  #figure.chute b { color: #ff6a4d; text-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 24px rgba(255,90,60,.4); }
  #figure.vue { animation: figure 1.9s ease-out forwards; }
  @keyframes figure {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
    12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    72% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -85%); }
  }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
  .label.poi { background: rgba(14,18,26,.82); border: 1px solid rgba(255,207,74,.6); color: #fff; padding: 3px 9px;
               border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; align-items: center; }
  .label.poi small { color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
  .label.poi::after { content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
                      border: 6px solid transparent; border-top-color: rgba(255,207,74,.8); border-bottom: 0; }
  .label.street { color: #fff; font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.8); letter-spacing: .3px; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.28) 100%); }
  #loader { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0e14; transition: opacity .8s; z-index: 10; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .box { width: min(420px, 80vw); text-align: center; }
  #loader h2 { font-weight: 600; margin: 0 0 4px; }
  #loader p { color: var(--dim); margin: 0 0 16px; }
  .track { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
  #load-bar { height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, var(--accent)); transition: width .2s; }
  #load-msg { margin-top: 10px; color: var(--dim); font-size: 12px; }
  /* ─────────────────────────────── TACTILE ────────────────────────────── */
  #tactile { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  #tactile[hidden] { display: none; }
  #manche { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; opacity: 0;
            border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(10,14,20,.30);
            transition: opacity .16s ease; }
  #manche.on { opacity: 1; }
  #manche i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
              border-radius: 50%; background: rgba(255,255,255,.34); border: 2px solid rgba(255,255,255,.5); }
  #actions { position: absolute; right: calc(18px + env(safe-area-inset-right));
             bottom: calc(26px + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
             align-items: center; gap: 12px; pointer-events: auto; }
  .rond { flex: none; width: 84px; height: 84px; border-radius: 50%; padding: 0; border: 2px solid rgba(255,255,255,.34);
          background: rgba(14,18,26,.55); color: var(--ink); font: 600 13px/1 system-ui, sans-serif;
          backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: none; }
  .rond.p { flex: none; width: 56px; height: 56px; font-size: 11px; }
  .rond:active, .rond.on { background: rgba(255,207,74,.34); border-color: var(--accent); color: #fff; }
  @media (max-width: 640px), (pointer: coarse) and (max-height: 520px) {
    #hud { width: auto; right: 14px; padding: 10px; }
    #sources { display: none; }
    #minimap { width: 92px; height: 92px; right: 12px; bottom: auto; top: calc(58px + env(safe-area-inset-top)); }
    #help-walk { white-space: normal; width: calc(100vw - 28px); text-align: center; }
    #auto { left: 12px; right: 112px; width: auto; bottom: auto; top: calc(58px + env(safe-area-inset-top)); padding: 7px 11px 9px; }
    #auto .compteur b { font-size: 26px; }
    #card { top: calc(58px + env(safe-area-inset-top)); max-width: 190px; }
  }
  body.tactile #help-walk { display: none; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="labels"></div>

<div id="hud" class="panel">
  <h1 id="hud-title" title="Replier / déplier">Poilhes <small>Hérault · 34310</small></h1>
  <div id="stats">…</div>
  <div class="row" id="villages">
    <a class="village" href="rouler.html?village=poilhes" data-village="poilhes">Poilhes</a>
    <a class="village" href="rouler.html?village=capestang" data-village="capestang">Capestang</a>
  </div>
  <div class="row">
    <button data-mode="trottinette" title="Traverser le village en trottinette électrique">Trottinette</button>
    <button data-mode="voiture" title="Berline bleue : traction, 380 N·m, elle pardonne">Berline</button>
  </div>
  <div class="row" id="choix-auto" hidden>
    <button data-auto="rouge" title="GT rouge">GT rouge</button>
    <button data-auto="bleue" class="on" title="Berline bleue">Berline bleue</button>
    <button data-son title="Son du moteur (touche M)">♪ Moteur</button>
  </div>
  <div class="row">
    <input id="search" list="places" placeholder="Aller à… (rue, mairie, église)" autocomplete="off">
    <datalist id="places"></datalist>
  </div>
  <div class="row time">
    <span>Heure</span>
    <input id="time" type="range" min="6.5" max="23.5" step="0.05" value="17.8">
    <span id="clock"></span>
  </div>
  <div class="row chips">
    <button data-time="9">Matin</button>
    <button data-time="13.5">Midi</button>
    <button data-time="19.3">Soir</button>
    <button data-time="22.3">Nuit</button>
    <button id="btn-labels" class="on" title="Touche N">Noms</button>
    <button id="btn-tour" hidden>Visite</button>
  </div>
  <div class="row" id="qualite">
    <span class="titre">Qualité <span class="compteur"><b id="qualite-fps">–</b> img/s</span></span>
    <button data-niveau="bas">Bas</button>
    <button data-niveau="moyen">Moyen</button>
    <button data-niveau="eleve">Élevé</button>
    <button class="mini" id="btn-retester" title="Mesurer à nouveau cette machine (deux secondes)">Retester</button>
    <span id="qualite-note"></span>
  </div>
  <div id="sources">Données : IGN (BD TOPO, LiDAR HD, BD ORTHO) — Etalab 2.0 · © OpenStreetMap</div>
</div>

<div id="card" class="panel" hidden></div>
<div id="help-walk" class="panel" hidden></div>
<!-- Éléments attendus par le moteur du village pour les modes absents ici :
     jamais affichés, ils existent pour que le moteur ne les cherche pas en vain. -->
<div id="viseur" hidden><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="9"/></svg></div>
<div id="vol" class="panel" hidden>
  <div class="ligne"><span>Vitesse</span><b><i id="vit">0</i> km/h</b></div>
  <div class="ligne"><span>Hauteur sol</span><b><i id="haut">0</i> m</b></div>
</div>
<div id="depart-auto" class="panel" hidden></div>
<div id="combat" class="panel" hidden>
  <div class="ligne"><span>Coque</span><b id="coque">100</b></div>
  <div id="jauge"><i></i></div>
  <div class="ligne"><span>Gobelins</span><b id="restants">0</b></div>
</div>
<div id="auto" class="panel" hidden>
  <div class="compteur"><b id="kmh">0</b><span>km/h</span><i id="rapport">1</i></div>
  <div id="regime"><i></i></div>
</div>
<div id="figure" hidden></div>
<canvas id="minimap" width="400" height="400" title="Cliquer pour s'y rendre"></canvas>
<div id="tactile" hidden>
  <div id="manche"><i></i></div>
  <div id="actions">
    <button class="rond p" id="btn-vue" type="button">Vue</button>
    <button class="rond p" id="btn-course" type="button">Cours</button>
    <button class="rond" id="btn-feu" type="button">MAIN</button>
  </div>
</div>

<div id="loader">
  <div class="box">
    <h2>Rouler dans le village</h2>
    <p>Trottinette et berline dans les rues reconstruites d’après l’IGN</p>
    <div class="track"><div id="load-bar"></div></div>
    <div id="load-msg">Chargement…</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./libs/three.module.js" } }
</script>
<script type="module">
import { startVillage } from './maps/poilhes-village.js?v=qualite-20260924';
import { NIVEAUX, lireChoix, appliquer, monterPanneau } from './maps/qualite.js?v=qualite-20260924';

const hud = document.getElementById('hud');
if (matchMedia('(max-width: 640px)').matches) hud.classList.add('collapsed');
document.getElementById('hud-title').addEventListener('click', () => hud.classList.toggle('collapsed'));

// Le village courant, souligné dans le choix.
const village = (new URLSearchParams(location.search).get('village') || 'poilhes').replace(/[^a-z-]/g, '');
document.querySelectorAll('#villages a').forEach((a) => a.classList.toggle('on', a.dataset.village === village));

// Premier lancement : rien de mémorisé. On charge en Élevé, on mesure, on
// conseille — et le conseil s'applique, une fois. Ensuite le joueur décide.
const memorise = lireChoix();
const loader = document.getElementById('loader'), msg = document.getElementById('load-msg');

startVillage({
  modes: ['trottinette', 'voiture'],
  qualite: NIVEAUX[memorise || 'eleve'],
  voitureUnique: 'bleue',
  ouvrir: false,
}).then(async (jeu) => {
  appliquer(jeu, NIVEAUX[memorise || 'eleve']);
  const panneau = monterPanneau({ racine: document.getElementById('qualite'), jeu, initial: memorise || 'eleve' });
  if (!memorise) {
    msg.textContent = 'Mesure de la machine…';
    const { ms, conseille } = await panneau.tester({ appliquerConseil: true });
    msg.textContent = `Réglé sur ${NIVEAUX[conseille].nom} (${ms.toFixed(1)} ms par image)`;
    await new Promise((r) => setTimeout(r, 900));
  }
  loader.classList.add('done');
  // On arrive directement en selle : cette page ne survole pas, elle roule.
  setTimeout(() => jeu.setMode('trottinette'), 400);
}).catch((err) => {
  console.error(err);
  msg.textContent = 'Erreur : ' + err.message;
});
</script>
</body>
</html>
